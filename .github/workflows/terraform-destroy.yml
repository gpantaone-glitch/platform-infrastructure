name: Terraform DEV Destroy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::078591672268:role/PlatformCIExecutionRole
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Assume Dev Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::317976464242:role/terraform-deployer-role
          aws-region: us-east-1
          role-chaining: true
          
      #Configure kubectl to talk to EKS
      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name org-dev-eks

      - name: Remove Kubernetes LoadBalancers
        run: |
          kubectl delete svc argocd-server -n argocd || true
          kubectl delete ingress tns-app -n tns || true
          sleep 60 

#### Uncomment this part
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::078591672268:role/PlatformCIExecutionRole
          aws-region: us-east-1   

      - name: Dev GitOps
        run: |
          cd envs/dev/05-gitops
          terraform init
          terraform destroy -auto-approve

      - name: Destroy Observability
        run: |
          cd envs/dev/04-observability
          terraform init
          terraform destroy -auto-approve

      - name: Destroy Platform
        run: |
          cd envs/dev/03-platform
          terraform init
          terraform destroy -auto-approve

      - name: Destroy EKS
        run: |
          cd envs/dev/02-eks
          terraform init
          terraform destroy -auto-approve 

      - name: Destroy Network
        run: |
          cd envs/dev/01-network
          terraform init
          terraform destroy -auto-approve

